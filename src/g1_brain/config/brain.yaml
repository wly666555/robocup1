g1_brain_node:
  ros__parameters:
    # 游戏相关参数
    game:
      field_type: "kid_size"
      playerStartPos: "left"
      player_role: "striker" # striker | goal_keeper

    
    # 机器人相关参数
    robot:
      height: 1.3
      scale_factor: 1.4
      pitch_compensation: -45.0   #
      yaw_compensation: 0.0

      yaw_limit_min: -50.0      #yaw
      yaw_limit_max: 50.0       #yaw
      pitch_limit_min: -20.0    #pitch
      pitch_limit_max: 85.0     #pitch
    
    # 记忆相关参数
    memory:
      memoryLength: 5.0  # 球位置记忆时间（秒）
    tree_file_path: "src/g1_brain/behavior_trees/game.xml"





